# /etc/nginx/conf.d/hys-tutor.conf
# 把 __DOMAIN__ 替换成你的域名；证书路径由 certbot 生成。
limit_req_zone $binary_remote_addr zone=hys_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hys_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hys_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /opt/hys-tutor/dist;
    index index.html;
    client_max_body_size 2m;

    # 登录/注册单独限流（不挡 /api/auth/me）
    location = /api/auth/login {
        limit_req zone=hys_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:5180;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/register {
        limit_req zone=hys_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:5180;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE：备课/对话是长连接，必须关闭缓冲并放宽读超时
    location /api/ {
        limit_req zone=hys_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 静态资源：Vite 产物带 hash，可长缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA 回退；index.html 不缓存，发版后立刻生效
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
